name: Run Target Tests

on: 
  push:
    branches:
      - '**'
    paths-ignore:
      - '.github/workflows/**'
  pull_request:
    types: [opened, synchronize, reopened]  
  workflow_dispatch:
    inputs:
      log_level:
        description: 'Log level'
        required: false
        default: 'warning'
      environment:
        description: 'Environment to run tests in'
        required: false
        default: 'staging'

jobs:
  target_tests:
    if: github.event_name == 'pull_request' || github.event.pull_request == null
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        submodules: 'recursive'
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Checkout submodules
      run: |
        git submodule init
        git submodule update
    - name: Read Python version
      run: echo "PYTHON_VERSION=$(cat .python-version | tr -d '\n')" >> $GITHUB_ENV
    - run: |
        echo "Log Level: ${{ github.event.inputs.log_level }}"
        echo "Environment: ${{ github.event.inputs.environment }}"
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        version: "0.13.4"
        enable-cache: true
    - name: Install dependencies
      run: |
        uv sync --locked
    - name: Set OPENAI_API_KEY
      run: echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> $GITHUB_ENV
    - name: Set HELICONE_API_KEY
      run: echo "HELICONE_API_KEY=${{ secrets.HELICONE_API_KEY }}" >> $GITHUB_ENV
    - name: Set DEV_ENV
      run: echo "DEV_ENV=${{ secrets.DEV_ENV }}" >> $GITHUB_ENV
    - name: Set GEMINI_API_KEY
      run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> $GITHUB_ENV
    - name: Run tests
      run: |
        make test

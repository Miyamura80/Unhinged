[project]
name = "python-template"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Miyamura80", email = "eitomiyamura@gmail.com" }
]
dependencies = [
    "black>=24.8.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "human-id>=0.2.0",
    "pytest>=8.3.3",
    "termcolor>=2.4.0",
    "loguru>=0.7.3",
    "vulture>=2.14",
    "dspy>=2.6.23",
    "tenacity>=9.1.2",
    # Backdoored litellm releases: 1.82.7/1.82.8 (Mar 2026) and 1.107.0 (Oct 2026). Never resolve them.
    "litellm>=1.68.2,!=1.82.7,!=1.82.8,!=1.107.0",
    "langfuse>=2.60.4",
    "pillow>=11.2.1",
    "requests>=2.32.3",
    "lxml>=5.4.0",
]
readme = "README.md"
requires-python = ">= 3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.13.4"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/python_template"]

[tool.vulture]
exclude = [
    ".venv/",
    "tests/test_template.py",
    "global_config/global_config.py",
    "src/utils/logging_config.py",
    "tests/conftest.py"
]
